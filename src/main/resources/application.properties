spring.application.name=baozi-store
server.port=8080

# ===== Banco de dados: H2 gravado em arquivo (pasta ./data do projeto) =====
spring.datasource.url=jdbc:h2:file:./data/baozistore
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Console web do H2: http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:file:./data/baozistore  | usuario: sa | senha em branco)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===== Para usar MySQL em vez do H2, comente o bloco acima e descomente este =====
#spring.datasource.url=jdbc:mysql://localhost:3306/baozistore?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
#spring.datasource.username=root
#spring.datasource.password=SUA_SENHA
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Mostra a mensagem de erro no corpo da resposta (ex.: "Cliente não encontrado")
server.error.include-message=always
